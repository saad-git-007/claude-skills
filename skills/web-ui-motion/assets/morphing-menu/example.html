<!doctype html>
<!-- Working demo of the morphing bottom dock. Serve this folder (e.g. `python3 -m http.server`) and open at phone width.
     Markup contract: see references/morphing-menu.md. Render it on the server so the dock links work before JS loads. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morphing dock demo</title>
<link rel="stylesheet" href="morphing-menu.css" media="(max-width: 1020px)">
<link rel="stylesheet" href="dock-theme.css">
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f1ea; color: #151515; }
  :root[data-theme="dark"] body { background: #0b1120; color: #f3efe6; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .card { background: rgba(127,127,127,.12); border-radius: 18px; padding: 20px; margin: 0 0 16px; height: 160px; }
</style>
</head>
<body>
<main>
  <h1>Morphing dock</h1>
  <p><button type="button" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">Toggle theme</button></p>
  <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
</main>

<div class="mm-dock">
  <nav class="morphing-menu" aria-label="Sections" data-view="collapsed">
    <div class="morphing-menu__shell">
      <div class="morphing-menu__bar">
        <a class="morphing-menu__shortcut" data-menu-item="home" href="#" aria-label="Home" aria-current="page"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg></span><span class="mm-cap" aria-hidden="true">Home</span></a>
        <a class="morphing-menu__shortcut" data-menu-item="times" href="#times" aria-label="Times"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span class="mm-cap" aria-hidden="true">Times</span></a>
        <a class="morphing-menu__shortcut" data-menu-item="places" href="#places" aria-label="Places"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span><span class="mm-cap" aria-hidden="true">Places</span></a>
        <a class="morphing-menu__shortcut" data-menu-item="events" href="#events" aria-label="Events"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg></span><span class="mm-cap" aria-hidden="true">Events</span></a>
        <a class="morphing-menu__shortcut" data-menu-item="donate" href="#donate" aria-label="Donate"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span><span class="mm-cap" aria-hidden="true">Donate</span></a>
        <button type="button" class="morphing-menu__shortcut" data-menu-item="more" aria-label="More" aria-expanded="false" aria-controls="mm-main"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg></span><span class="mm-cap" aria-hidden="true">More</span></button>
      </div>
      <div id="mm-main" class="morphing-menu__panel" aria-hidden="true" inert>
        <a class="morphing-menu__row" data-menu-item="news" href="#news"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg></span><span class="morphing-menu__label">Newsletter</span></a>
        <a class="morphing-menu__row" data-menu-item="contact" href="#contact"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg></span><span class="morphing-menu__label">Contact us</span></a>
        <a class="morphing-menu__row" data-menu-item="partner" href="https://example.org/" target="_blank" rel="noopener"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg></span><span class="morphing-menu__label">Partner site</span><span class="ext" aria-label="(opens in a new tab)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5h10v10"/><path d="M19 5 6 18"/></svg></span></a>
        <a class="morphing-menu__row" data-menu-item="admin" href="#admin"><span class="morphing-menu__icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span><span class="morphing-menu__label">Admin</span></a>
      </div>
    </div>
  </nav>
</div>
<script src="morph-menu.bundle.js" defer></script>
</body>
</html>
